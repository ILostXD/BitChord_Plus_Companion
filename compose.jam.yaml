services:
  companion:
    build: .
    image: bitchord-plus-companion:local
    user: "${COMPANION_UID:-10001}:${COMPANION_GID:-10001}"
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      COMPANION_STATE_PATH: /state
    volumes:
      - companion-state:/state
    ports:
      - "${COMPANION_BIND_ADDRESS:-127.0.0.1}:${COMPANION_PORT:-8088}:8080"
    networks: [media]
    read_only: true
    tmpfs:
      - /tmp:size=2147483648,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/live', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
networks:
  media:
    external: true
    name: ${DOCKER_NETWORK:-mediaserver_default}

volumes:
  companion-state:
