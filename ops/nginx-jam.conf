# Companion APIs authenticate every request. Legacy tagging routes return 410 for the owner.
server {
    listen 80;
    server_name companion.example.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name companion.example.com;
    ssl_certificate /etc/letsencrypt/live/companion.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/companion.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    client_max_body_size 8k;

    location = /live { proxy_pass http://127.0.0.1:8088; }
    location = /api/v1/jam/sessions { proxy_pass http://127.0.0.1:8088; }
    location ^~ /api/v1/jam/sessions/ {
        client_max_body_size 101m;
        client_body_timeout 180s;
        proxy_pass http://127.0.0.1:8088;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        access_log off; # Subsonic auth tokens must not enter query-string access logs.
    }
    location = /api/v1/jam/ws {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }
    location = /api/v1/acquisition/jobs {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:8088;
    }
    location ^~ /api/v1/acquisition/jobs/ {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:8088;
    }
    location = /api/v1/releases {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8088;
    }
    location = /api/v1/capabilities { proxy_pass http://127.0.0.1:8088; }
    location ^~ /api/v1/metadata/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8088;
    }
    location = /api/v1/storage {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8088;
    }
    location = /api/v1/tagging/jobs {
        limit_except GET POST { deny all; }
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8088;
    }
    location ^~ /api/v1/tagging/jobs/ {
        limit_except GET POST DELETE { deny all; }
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8088;
    }
    location ^~ /api/v1/releases/ {
        limit_except GET PUT POST { deny all; }
        proxy_pass http://127.0.0.1:8088;
    }
    location / { return 404; }
}
